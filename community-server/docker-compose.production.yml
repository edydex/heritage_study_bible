name: heritage-community

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-community-environment: &community-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.production}
  COMMUNITY_PUBLIC_URL: ${COMMUNITY_PUBLIC_URL:?Set COMMUNITY_PUBLIC_URL in .env.production}
  COMMUNITY_ID: ${COMMUNITY_ID:?Set COMMUNITY_ID in .env.production}
  COMMUNITY_NAME: ${COMMUNITY_NAME:?Set COMMUNITY_NAME in .env.production}
  COMMUNITY_DESCRIPTION: ${COMMUNITY_DESCRIPTION:-A Heritage church community.}
  COMMUNITY_CCLI_LICENSE_NUMBER: ${COMMUNITY_CCLI_LICENSE_NUMBER:-}
  COMMUNITY_TIME_ZONE: ${COMMUNITY_TIME_ZONE:-UTC}
  COMMUNITY_AUTH_ENABLED: ${COMMUNITY_AUTH_ENABLED:-true}
  HERITAGE_APP_URL: ${HERITAGE_APP_URL:?Set HERITAGE_APP_URL in .env.production}
  HERITAGE_APP_ORIGINS: ${HERITAGE_APP_ORIGINS:?Set HERITAGE_APP_ORIGINS in .env.production}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-heritage@example.church}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Heritage Community}
  COMMUNITY_COPYRIGHT_CONTACT_EMAIL: ${COMMUNITY_COPYRIGHT_CONTACT_EMAIL:-}
  # These are present only during the installer's first, verified boot. The
  # installer removes them and recreates the container immediately afterward.
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  HERITAGE_SERMON_MEDIA_PATH: /app/private/sermon-media
  HERITAGE_SYNCSHOW_SERMON_MEDIA_ENABLED: ${HERITAGE_SYNCSHOW_SERMON_MEDIA_ENABLED:-false}
  HERITAGE_SERMON_MEDIA_MAX_ACTIVE_GLOBAL: ${HERITAGE_SERMON_MEDIA_MAX_ACTIVE_GLOBAL:-8}
  HERITAGE_SERMON_MEDIA_MAX_ACTIVE_PER_COMMUNITY: ${HERITAGE_SERMON_MEDIA_MAX_ACTIVE_PER_COMMUNITY:-4}
  HERITAGE_SERMON_MEDIA_MAX_ACTIVE_PER_CONNECTION: ${HERITAGE_SERMON_MEDIA_MAX_ACTIVE_PER_CONNECTION:-2}
  HERITAGE_SERMON_MEDIA_MAX_FINALIZING_GLOBAL: ${HERITAGE_SERMON_MEDIA_MAX_FINALIZING_GLOBAL:-1}
  HERITAGE_SERMON_MEDIA_MAX_RETAINED_BYTES_PER_COMMUNITY: ${HERITAGE_SERMON_MEDIA_MAX_RETAINED_BYTES_PER_COMMUNITY:-53687091200}
  HERITAGE_SERMON_MEDIA_MAX_RETAINED_OBJECTS_PER_COMMUNITY: ${HERITAGE_SERMON_MEDIA_MAX_RETAINED_OBJECTS_PER_COMMUNITY:-2000}
  HERITAGE_SERMON_MEDIA_STORAGE_RESERVE_BYTES: ${HERITAGE_SERMON_MEDIA_STORAGE_RESERVE_BYTES:-5368709120}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    logging: *default-logging

  community:
    image: ${HERITAGE_COMMUNITY_IMAGE:-heritage-community:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    init: true
    restart: unless-stopped
    environment:
      <<: *community-environment
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${COMMUNITY_LOCAL_PORT:-3000}:3000"
    volumes:
      - media:/app/media
      - sermon-media:/app/private/sermon-media
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/catalogs/readingPlans').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

  migrate:
    image: ${HERITAGE_MIGRATION_IMAGE:-heritage-community:migrations-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    profiles:
      - operations
    init: true
    environment:
      <<: *community-environment
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  sermon-media-maintenance:
    image: ${HERITAGE_MIGRATION_IMAGE:-heritage-community:migrations-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    profiles:
      - operations
    init: true
    user: "1001:1001"
    environment:
      <<: *community-environment
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HERITAGE_SERMON_MEDIA_MAINTENANCE_QUIESCED: "false"
      HERITAGE_SERMON_MEDIA_MAINTENANCE_REQUIRE_BACKUP_READY: "false"
      HERITAGE_SERMON_MEDIA_ORPHAN_GRACE_SECONDS: ${HERITAGE_SERMON_MEDIA_ORPHAN_GRACE_SECONDS:-86400}
    volumes:
      - sermon-media:/app/private/sermon-media
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - --import
      - tsx
      - scripts/sermon-media-maintenance.mjs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.1}
    profiles:
      - cloudflare-token
    init: true
    restart: unless-stopped
    environment:
      # The installer validates this before enabling the profile. Keeping the
      # interpolation optional lets locally managed host tunnels run without a
      # token in the deployment environment.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    networks:
      - edge
    depends_on:
      community:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
    name: ${HERITAGE_POSTGRES_VOLUME:-heritage-community-postgres}
  media:
    name: ${HERITAGE_MEDIA_VOLUME:-heritage-community-media}
  sermon-media:
    name: ${HERITAGE_SERMON_MEDIA_VOLUME:-heritage-community-sermon-media}
