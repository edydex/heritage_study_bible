services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: heritage_community
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage
    ports:
      - "5432:5432"
    volumes:
      - heritage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage_community"]
      interval: 5s
      timeout: 5s
      retries: 10

  community:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - heritage-media:/app/media

volumes:
  heritage-postgres:
  heritage-media:
