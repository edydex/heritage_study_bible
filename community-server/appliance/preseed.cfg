### Heritage Community Server appliance defaults for Debian 13.
###
### This intentionally does NOT preseed passwords or disk partitioning. Debian
### must still ask the operator which internal disk to use and confirm changes.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string heritage-community
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# Keep one ordinary administrator account instead of creating a separate root
# password. Debian then grants the first user sudo access automatically.
d-i passwd/root-login boolean false

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

clock-setup clock-setup/utc boolean true
time time/zone string America/Los_Angeles
clock-setup clock-setup/ntp boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo ca-certificates curl git
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# Copy the baked source bundle and friendly first-login setup command only
# after Debian has finished the operator-confirmed installation.
d-i preseed/late_command string /bin/sh /cdrom/heritage/late-command.sh
