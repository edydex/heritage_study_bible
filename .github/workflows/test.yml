name: Test

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check audiobook phrase matching
        run: python3 scripts/audiobook-alignment/test_match.py

      - name: Check complete Bible timing validation
        run: python3 -m unittest discover -s scripts/bible-audio -p 'test_*.py'

      - name: Run tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Retain navigation wheel failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heritage-navigation-wheel-failures
          path: |
            test-results/navigation-wheel-*/trace.zip
            test-results/navigation-wheel-*/test-failed-*.png
            test-results/navigation-wheel-*/navigation-wheel-failure.json
            test-results/navigation-wheel-*/error-context.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build
