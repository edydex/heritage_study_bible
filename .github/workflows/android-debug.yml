name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package after acceptance
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify failed-emulator cleanup
        run: python3 scripts/test_android_runner_cleanup.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 compiles its Android library for Java 21. JDK 26
          # currently breaks AGP's Android JDK image transform (`jlink`).
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Run native Community acceptance
        run: bash scripts/run-android-acceptance.sh

      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heritage-android-native-acceptance
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/native-acceptance/
          if-no-files-found: warn
          retention-days: 30

      - name: Download the previous signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/heritage-previous"
          gh release download v1.1.32 --pattern heritage-study-bible-1.1.32-debug.apk --dir "$RUNNER_TEMP/heritage-previous"

      - name: Verify package, signer, web assets and native tests
        run: python3 scripts/verify_android_apk.py --previous-apk "$RUNNER_TEMP/heritage-previous/heritage-study-bible-1.1.32-debug.apk"

      - name: Upload verified Android package
        uses: actions/upload-artifact@v4
        with:
          name: heritage-study-bible-debug-apk
          path: android-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the verified Android release
        if: github.ref == 'refs/heads/main' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-release.mjs
